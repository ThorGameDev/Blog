<!DOCTYPE html>
<html>
    <head>
        <title>Blog</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style/site.css">
    </head>
    <body>
        <h1>Sign Up</h1>
        <p id=errorDisplay></p>
        <form action="api/security/signup" method="post" id="signupForm">
            <input type="text" id="username" name="username" placeholder="Username">
            <input type="password" id="password" name="password" placeholder="Password">
            <input type="password" id="confirmPass" name="confirmPass" placeholder="Confirm Pass">
            <input type="hidden" id="from" name="from" value="/index.html">
            <button type="submit">Submit</button>
        </form>
        <p>Already have an account? <a href="login.html?from=/index.html">Login</a> instead.</p>
        <script src="scripts/signup.js"></script>
    </body>
</html>
