<!DOCTYPE html>
<html lang="{{ LangCode }}">
    <head>
        <title>{{ Global.BlogTitle }}: {{ PageTitle }}</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="/style/site.css">
		{{ LangTags }}
    </head>
    <body>
        {{ TopBar }}
        <h1>{{ PageTitle }}</h1>
        <p id=errorDisplay>{{ Errors }}</p>
        <form action="/api/security/login?lang={{ LangCode }}" method="post" id="loginForm">
            <input type="text" id="username" name="username" placeholder="{{ UsernamePrompt }}">
            <input type="password" id="password" name="password" placeholder="{{ PasswordPrompt }}">
            <input type="hidden" id="from" name="from" value="{{ ReturnURL }}">
            <button type="submit">{{ SubmitPrompt }}</button>
        </form>
        <p>{{ SwitchPrompt }}</p>
        {{ BottomBar }}
    </body>
</html>
