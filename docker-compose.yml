services:
  nginx-frontend:
    container_name: blog-frontend
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - MODE=dev
    volumes:
      - uploads:/usr/share/nginx/html/uploads
    ports:
      - "8080:8080"
    depends_on:
      - api
    networks:
      - app-network
  
  api:
    container_name: blog-api
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - database/postgres.env
    volumes:
      - uploads:/uploads
      - workdir:/workdir
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
      - postgres-network
      - worker-network

  image-sanitizer:
    container_name: blog-image-sanitizer
    build:
      context: ./workers/image-sanitizer/
      dockerfile: Dockerfile
    networks:
      - worker-network
    volumes:
      - workdir:/home/worker/app/workdir

  db:
    container_name: blog-db
    build:
      context: ./database/
      dockerfile: Dockerfile
    restart: always
    env_file:
      - database/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - postgres-network

networks:
  app-network:
    driver: bridge
  postgres-network:
    driver: bridge
  worker-network:
    driver: bridge

volumes:
  uploads:
  workdir:
  pgdata:
